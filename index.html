            background: #d93b3b;

        function parseFullBalanceLine(text) {
            if (!text) return null;
            const result = { balance: null, timestamp: null };

            const balMatch = text.match(/BAL:\s*R\s*(-?[\d\s]+(?:[.,]\d{1,2})?)/i);
            if (balMatch) {
                let numStr = balMatch[1].replace(/\s+/g, '').replace(',', '.');
                const parsed = parseFloat(numStr);
                if (!isNaN(parsed)) result.balance = parsed;
            }

            const tsMatch = text.match(/@\s*([0-9]{1,2}\/[0-9]{1,2}\/[0-9]{2,4},\s*[0-9]{1,2}:[0-9]{2}\s*(?:AM|PM))/i);
            if (tsMatch) {
                result.timestamp = tsMatch[1].trim();
            }

            if (result.balance === null && result.timestamp === null) return null;
            return result;
        }

        function updateLowBalanceCount() {
            const lowCount = currentData.filter(item => item.balance < 5).length;
            lowBalanceCountSpan.textContent = `${lowCount} meter${lowCount !== 1 ? 's' : ''} below R5`;
        }

        function renderLowSummary() {
            const lowItems = currentData.map((item, index) => ({ ...item, index })).filter(item => item.balance < 5);
            const count = lowItems.length;

            if (count === 0) {
                lowSummary.classList.add('empty');
                lowSummaryTitle.textContent = 'All meters are above R5 — no low balances';
                lowChips.innerHTML = '';
                return;
            }

            lowSummary.classList.remove('empty');
            lowSummaryTitle.textContent = `${count} meter${count !== 1 ? 's' : ''} below R5 — click a chip to jump to it`;

            let chipsHtml = '';
            lowItems.forEach(item => {
                chipsHtml += `
                    <a href="#" class="low-chip" data-index="${item.index}">
                        <div class="chip-left">
                            <span class="chip-unit">${item.unit}</span>
                            <span class="chip-rand">R ${item.balance.toFixed(2)}</span>
                        </div>
                    </a>
                `;
            });
            lowChips.innerHTML = chipsHtml;

            lowChips.querySelectorAll('.low-chip').forEach(chip => {
                chip.addEventListener('click', function(e) {
                    e.preventDefault();
                    const idx = parseInt(this.dataset.index, 10);
                    const row = document.querySelector(`tbody tr[data-index="${idx}"]`);
                    if (row) {
                        document.querySelectorAll('tbody tr').forEach(tr => tr.classList.remove('active-row'));
                        row.classList.add('active-row');
                        const input = row.querySelector('.balance-input');
                        if (input) {
                            input.focus();
                            row.scrollIntoView({ behavior: 'smooth', block: 'center' });
                        }
                    }
                });
            });
        }

            renderLowSummary();
        }

        function renderTable() {
            let html = '';
            currentData.forEach((item, index) => {
                const isLow = item.balance < 5;
                const wrapperClass = `balance-input-wrapper ${isLow ? 'low-balance' : ''}`;

                html += `
                    <tr data-index="${index}">
                        <td class="unit-name">${item.unit}</td>
                        <td class="meter-number">${item.meter}</td>
                        <td>
                            <div class="balance-cell">
                                <div class="${wrapperClass}">
                                    <span class="currency-symbol">R</span>
                                    <input type="text" class="balance-input" data-index="${index}" value="${item.balance.toFixed(2)}" aria-label="Balance for ${item.unit}">
                                </div>
                                ${isLow ? '<span class="flag-badge">⚠ LOW</span>' : ''}
                            </div>
                        </td>
                        <td class="timestamp">${item.timestamp}</td>
                    </tr>
                `;
            });
            tableBody.innerHTML = html;
            attachTableEvents();
            refreshSummaries();
        }

        function updateRowLowState(index) {
            const row = document.querySelector(`tbody tr[data-index="${index}"]`);
            if (!row) return;
            const input = row.querySelector('.balance-input');
            if (!input) return;
            const wrapper = input.closest('.balance-input-wrapper');
            const balanceCell = wrapper.parentElement;
            const isLow = currentData[index].balance < 5;

            if (isLow) wrapper.classList.add('low-balance');
            else wrapper.classList.remove('low-balance');

            const existingBadge = balanceCell.querySelector('.flag-badge');
            if (existingBadge) existingBadge.remove();
            if (isLow) {
                const badge = document.createElement('span');
                badge.className = 'flag-badge';
                badge.textContent = '⚠ LOW';
                balanceCell.appendChild(badge);
            }
        }

        function attachTableEvents() {
            document.querySelectorAll('.balance-input').forEach(input => {
                const index = parseInt(input.dataset.index, 10);

                input.addEventListener('focus', function() {
                    document.querySelectorAll('tbody tr').forEach(tr => tr.classList.remove('active-row'));
                    this.closest('tr').classList.add('active-row');
                });

                input.addEventListener('blur', function() {
                    const idx = parseInt(this.dataset.index, 10);
                    let numericValue = parseFloat(this.value.trim());
                    if (isNaN(numericValue)) numericValue = 0;
                    this.value = numericValue.toFixed(2);
                    currentData[idx].balance = numericValue;
                    updateRowLowState(idx);
                    refreshSummaries();
                });

                input.addEventListener('input', function() {
                    const idx = parseInt(this.dataset.index, 10);
                    let raw = this.value.trim();
                    let numericValue = parseFloat(raw);
                    if (raw === '' || isNaN(numericValue)) numericValue = 0;
                    currentData[idx].balance = numericValue;
                    updateRowLowState(idx);
                    refreshSummaries();
                });

                input.addEventListener('paste', function(e) {
                    const pastedText = (e.clipboardData || window.clipboardData).getData('text');
                    if (!pastedText) return;
                    const parsed = parseFullBalanceLine(pastedText);
                    if (parsed && (parsed.balance !== null || parsed.timestamp !== null)) {
                        e.preventDefault();
                        const idx = parseInt(this.dataset.index, 10);
                        if (parsed.balance !== null) {
                            currentData[idx].balance = parsed.balance;
                            this.value = parsed.balance.toFixed(2);
                        }
                        if (parsed.timestamp !== null) {
                            currentData[idx].timestamp = parsed.timestamp;
                            const row = this.closest('tr');
                            const tsCell = row.querySelector('.timestamp');
                            if (tsCell) tsCell.textContent = parsed.timestamp;
                        }
                        if (parsed.balance !== null) this.value = parsed.balance.toFixed(2);
                        updateRowLowState(idx);
                        refreshSummaries();
                    }
                });
            });
        }

        document.getElementById('exportBtn').addEventListener('click', function() {
            let csvContent = "Unit,Meter Number,Balance (ZAR),Last Update\n";
            currentData.forEach(item => {
                csvContent += `"${item.unit}","${item.meter}","${item.balance.toFixed(2)}","${item.timestamp}"\n`;
            });
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            link.setAttribute("href", URL.createObjectURL(blob));
            link.setAttribute("download", `River_Glen_Balances_${new Date().toISOString().split('T')[0]}.csv`);
            link.style.visibility = 'hidden';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        });

        const fileInput = document.getElementById('fileInput');
        document.getElementById('importBtn').addEventListener('click', () => fileInput.click());

        fileInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(event) {
                const lines = event.target.result.split('\n');
                if (lines.length < 2) return alert("Invalid CSV.");
                let importCount = 0;
                for (let i = 1; i < lines.length; i++) {
                    const line = lines[i].trim();
                    if (!line) continue;
                    const parts = line.split(',').map(s => s.replace(/^"|"$/g, '').trim());
                    if (parts.length >= 3) {
                        const meter = parts[1];
                        const parsedBalance = parseFloat(parts[2].replace(/\s+/g, ''));
                        const timestamp = parts.length >= 4 ? parts[3] : '';
                        if (!isNaN(parsedBalance)) {
                            const targetIndex = currentData.findIndex(item => item.meter === meter);
                            if (targetIndex !== -1) {
                                currentData[targetIndex].balance = parsedBalance;
                                if (timestamp) currentData[targetIndex].timestamp = timestamp;
                                importCount++;
                            }
                        }
                    }
                }
                if (importCount > 0) {
                    renderTable();
                    alert(`Imported and updated ${importCount} meters.`);
                } else alert("No matching Meter Numbers found.");
            };
            reader.readAsText(file);
            fileInput.value = '';
        });

        document.getElementById('resetBalancesBtn').addEventListener('click', function() {
            currentData = JSON.parse(JSON.stringify(originalData));
            renderTable();
        });

        renderTable();
    })();
</script>
</body>
</html>
